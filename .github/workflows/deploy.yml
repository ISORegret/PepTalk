# If "job was not acquired by Runner" or "Internal server error" appears, re-run the workflow
# (Actions → Deploy to GitHub Pages → Re-run all jobs). Both are usually transient GitHub issues.
#
# On each push to main: bumps app version (same rules as scripts/bump-version.js), builds APK + web,
# deploys to GitHub Pages, then commits the new version back to main (pushes from GITHUB_TOKEN do not
# re-trigger this workflow). Pull after deploy to sync your clone. If main is branch-protected, allow
# GitHub Actions to bypass or use a PAT — otherwise the commit step may fail.
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      # Optional: add repo secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY so the Pages build
      # includes public/supabase-config.json and Profile → cloud sign-in works on the web app.
      - name: Write Supabase config for web (optional)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            node -e "require('fs').writeFileSync('public/supabase-config.json', JSON.stringify({url:process.env.SUPABASE_URL, anonKey:process.env.SUPABASE_ANON_KEY}));"
            echo "Wrote public/supabase-config.json from repository secrets."
          else
            echo "No VITE_SUPABASE_* secrets — web app stays local-only unless you commit public/supabase-config.json."
          fi

      # Capacitor sets Java 21 in android/app/capacitor.build.gradle — JDK 17 fails the Gradle compile.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Default tools + API 36 platform (matches android/variables.gradle compileSdkVersion)
          packages: 'tools platform-tools platforms;android-36'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Bump version (release)
        run: node scripts/bump-version.js

      - name: Build APK for download page (website/PepTalk.apk)
        run: npm run build:apk:ci
      
      - name: Build
        run: npm run build -- --mode pages
      
      - name: Prepare deploy (landing + app + APK)
        run: |
          mkdir -p dist/PepTalk
          find dist -maxdepth 1 -mindepth 1 ! -name PepTalk -exec mv {} dist/PepTalk/ \;
          sed -i 's|/PepTalk/|/PepTalk/PepTalk/|g' dist/PepTalk/manifest.json 2>/dev/null || true
          VERSION=$(grep -o '"version": "[^"]*"' package.json | head -1 | cut -d'"' -f4)
          sed "s/__APK_VERSION__/$VERSION/g" website/index.html > dist/index.html
          if [ -f website/PepTalk.apk ]; then
            cp website/PepTalk.apk dist/
            ls -la dist/PepTalk.apk
          else
            echo "::warning::website/PepTalk.apk missing — APK build step may have failed silently."
          fi
          [ -d website/screenshots ] && cp -r website/screenshots dist/ || true

      - name: Commit and push release version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/App.jsx android/app/build.gradle website/index.html
          if git diff --staged --quiet; then
            echo "No version file changes to commit."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: release v${VERSION} [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
